# ===========================================================================
# Local development stack for deepseismic2
#
# Default usage (Azurite only — recommended for most dev work):
#   docker compose up -d azurite
#
# Full local stack (Azurite + API):
#   docker compose --profile full up
# ===========================================================================

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: deepseismic-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --debug /data/debug.log
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azurite-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  # API service — only started with --profile full
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deepseismic-api
    ports:
      - "8000:8000"
    # .env in repo root is optional; the Azurite conn string below always wins
    env_file:
      - path: ../.env
        required: false
    environment:
      # Point at Azurite inside the Docker network (hostname = service name)
      # Uses the well-known Azurite dev account — see .env.example
      STORAGE_CONNECTION_STRING: "${STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=REPLACE_WITH_AZURITE_KEY;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
      LOCAL_DEV: "true"
    depends_on:
      azurite:
        condition: service_healthy
    profiles:
      - full

volumes:
  azurite-data:
    driver: local
