[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deepseismic2"
version = "0.7.1"
description = "Cloud-native seismic interpretation proof of concept"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "jospaid" },
]
dependencies = [
  "torch>=2.3.0",
  "segyio>=1.9.12",
  "xarray>=2025.1.0",
  "zarr>=2.18.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "pandas>=2.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "azure-storage-blob>=12.22.0",
  "azure-identity>=1.17.0",
  "azure-ai-projects>=1.0.0b6",
  "azure-ai-inference>=1.0.0b9",
  "azure-search-documents>=11.6.0b4",
  "openai>=1.40.0",
  "matplotlib>=3.9.0",
  "plotly>=5.23.0",
  "httpx>=0.27.0",
  "azure-monitor-opentelemetry>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.11.0",
]
ui = [
  "streamlit>=1.38.0",
  "gradio>=4.40.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseismic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["src/tests"]
addopts = "-ra"
markers = [
  "integration: tests that require real infrastructure (Azurite, Azure, GPU) — excluded from default CI run",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
